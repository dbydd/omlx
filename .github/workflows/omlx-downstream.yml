name: omlx downstream

# Keeps this tap on the newest jundot/omlx release with our patches applied.
#
# The job resolves the newest upstream release, checks out that tag, applies
# patches/*.patch (formula extras + Metal probe, battery pause), points the
# formula url/sha256 at the tag — adding an explicit version when Homebrew
# would mis-parse the tag, as it reads v0.7.1.dev1 as "1" — and opens a PR
# from the tagged tree. The PR's merge-base is the tag, so its diff is just
# our patches; the merge into main is where upstream drift shows up. A patch
# that no longer applies fails the run with the conflicting hunk, which is
# the signal to rebase the patch by hand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build from (default: newest release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omlx-downstream
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: jundot/omlx
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the newest upstream release
        id: upstream
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          # "+" so a retagged release overwrites the local tag
          git fetch --no-tags "https://github.com/$UPSTREAM" "+refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the patched tree (upstream ${{ steps.upstream.outputs.tag }})
        id: build
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          branch="omlx-downstream/$TAG"
          # patches/ and workflow tooling live on our branches, not upstream's
          # tag: carry them across the checkout.
          mkdir -p /tmp/downstream
          cp -R patches /tmp/downstream/patches
          git checkout -q -B "$branch" "refs/tags/$TAG"
          mkdir -p patches
          cp -R /tmp/downstream/patches/. patches/
          for patch in patches/*.patch; do
            echo "applying $patch"
            git apply --3way --whitespace=nowarn "$patch"
          done
          # Source patches reach the pip build through recipe `patch do`
          # blocks (the formula builds the upstream tarball, not this tree).
          # Fresh blocks each run: sha from the copy in this checkout, URL
          # from main where the PR merges. The recipe-modding patch is
          # excluded: it edits the recipe, not the buildpath.
          inject=""
          for patch in patches/*.patch; do
            case "$patch" in
              patches/omlx-formula-downstream.patch) continue ;;
            esac
            psha=$(shasum -a 256 "$patch" | cut -d' ' -f1)
            praw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/$patch"
            inject="${inject}  patch do\n    url \"$praw\"\n    sha256 \"$psha\"\n  end\n"
          done
          if [ -n "$inject" ]; then
            ruby -e '
              body = File.read("Formula/omlx.rb")
              # printf already turned the \n escapes into real newlines.
              block = ARGV[0]
              # Insert after the license line. A block beats a "\\1" backreference,
              # which a shell-quoted script turns into an octal escape.
              m = body.match(/^  license .*\n/)
              abort "license line not found" unless m
              # $(...) strips the trailing newline printf produced.
              body.insert(m.end(0), block.end_with?("\n") ? block : block + "\n")
              File.write("Formula/omlx.rb", body)
            ' "$(printf "$inject")"
          fi
          url="https://github.com/$UPSTREAM/archive/refs/tags/$TAG.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          # Homebrew's URL version parser reads tags such as v0.7.1.dev1 as
          # "1", which sorts above every real release. State the version when
          # the tag has a prerelease suffix.
          version=${TAG#v}
          if printf '%s' "$version" | grep -Evq '^[0-9]+(\.[0-9]+)*$'; then
            version_prefix="  version \"$version\""
          else
            version_prefix=""
          fi
          ruby -e '
            path, url, sha, prefix = ARGV
            body = File.read(path)
            abort "url line not found" unless body.sub!(/^  url .*$/, %Q{  url "#{url}"})
            abort "sha256 line not found" unless body.sub!(/^  sha256 .*$/, %Q{  sha256 "#{sha}"})
            unless prefix.empty?
              # Drop any version line the tag already carries, then insert
              # after sha256, with its own newline: $(...) strips a trailing
              # one, so the license line would otherwise end up glued here.
              body.sub!(/^  version .*\n/, "")
              m = body.match(/^  sha256 .*\n/)
              abort "sha256 line not found" unless m
              body.insert(m.end(0), prefix + "\n")
            end
            File.write(path, body)
          ' Formula/omlx.rb "$url" "$sha" "$(printf "$version_prefix")"

      - name: Check the formula parses
        run: ruby -c Formula/omlx.rb

      - name: Open a pull request when something moved
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          branch="omlx-downstream/$TAG"
          git add -A
          if git diff --cached --quiet; then
            echo "already at $TAG with patches applied"
            exit 0
          fi
          version=${TAG#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "omlx $version"
          git push --force-with-lease -u origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR for $branch already open"
            exit 0
          fi
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "omlx $version" \
            --body "Tracks upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG): full tagged tree with \`patches/*.patch\` applied, formula url/sha256/version repointed.

          Patch set: \`patches/omlx-formula-downstream.patch\` (extras options, Metal probe) and \`patches/battery-pause.patch\` (pause models on battery power).

          Build with \`brew upgrade dbydd/omlx/omlx --with-custom-kernel --with-mcp --with-cluster --with-modelscope\`."
